# FreePRO never queries this database: it only exists so Rails can boot
# (rails/all loads ActiveRecord). No MySQL server or credentials are needed.
# On Windows the mysql2 gem is not installed (see Gemfile), so SQLite is used.
<% adapter = Gem.win_platform? ? 'sqlite3' : 'mysql2' %>
development:
  adapter: <%= adapter %>
  database: <%= Gem.win_platform? ? 'db/development.sqlite3' : 'freepro_development' %>

test:
  adapter: <%= adapter %>
  database: <%= Gem.win_platform? ? 'db/test.sqlite3' : 'freepro_test' %>

production:
  adapter: <%= adapter %>
  database: freepro_production
