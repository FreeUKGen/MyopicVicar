name: myopicvicar

x-app-env: &app-env
  RAILS_ENV: development
  LOAD_DATA: ${LOAD_DATA:-none}
  MONGO_HOST: mongo
  MONGO_PORT: "27017"
  MYOPIC_VICAR_IMPORT_DIR: ./tmp/mongo_import
  NEW_RELIC_AGENT_ENABLED: "false"

services:
  app:
    build:
      context: ../..
      dockerfile: dev/docker/Dockerfile
    image: myopicvicar_app:compose
    working_dir: /app
    volumes:
      - ../../:/app:cached
      - bundle_data:/usr/local/bundle
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started

  mysql:
    image: mariadb:10.3
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: freereg2_development
      MYSQL_USER: freereg2
      MYSQL_PASSWORD: freereg2
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootroot"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:4.4
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  bundle_data:
  mysql_data:
  mongo_data:
